name: Release

# Pushing an annotated v<MAJOR>.<MINOR>.<PATCH> tag on master builds, tests and checks the plugin
# package, generates the custom repository metadata it would be served with, then creates a DRAFT
# GitHub Release with the package. A draft is visible only to the repository's maintainers;
# publishing it is always a manual step. Nothing here submits to Dalamud or updates the custom
# repository: that is the Publish custom repository workflow (publish-custom-repository.yml), run by
# hand after the GitHub Release has been published.
#
# Run it by hand (Actions > Release > Run workflow) for a dry run: the same build, tests, package
# checks and metadata generation, with everything kept as a workflow artifact and no release created.
#
# Full process: docs/Releasing.md and docs/CustomRepository.md.

on:
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  package:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        # History and tags, to check where the tag points.
        fetch-depth: 0
        persist-credentials: false

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Read the product version
      id: version
      shell: pwsh
      run: |
        $version = ([xml](Get-Content Version.props)).Project.PropertyGroup.Version.Trim()
        if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version.props holds '$version', not MAJOR.MINOR.PATCH." }
        "version=$version" >> $env:GITHUB_OUTPUT
        "AetherFrame $version from $env:GITHUB_REF"

    # The tag must be the release the policy describes (docs/Versioning.md): annotated, named after
    # Version.props, and on master.
    - name: Check the tag
      if: github.ref_type == 'tag'
      shell: pwsh
      env:
        TAG: ${{ github.ref_name }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        if ($env:TAG -ne "v$env:VERSION") { throw "Tag $env:TAG does not match Version.props ($env:VERSION)." }
        # Checkout may store a pushed tag as a lightweight ref; fetch the real one.
        git fetch --force --no-tags origin "refs/tags/$($env:TAG):refs/tags/$($env:TAG)"
        if ((git cat-file -t "refs/tags/$env:TAG") -ne 'tag') { throw "$env:TAG is a lightweight tag. Release tags are annotated." }
        if ((git rev-parse "$($env:TAG)^{commit}") -ne $env:GITHUB_SHA) { throw "$env:TAG does not point at the commit being built." }
        git merge-base --is-ancestor $env:GITHUB_SHA origin/master
        if ($LASTEXITCODE -ne 0) { throw "$env:TAG is not on master." }

    # Dalamud.NET.Sdk takes the Dalamud reference assemblies from DALAMUD_HOME.
    - name: Download Dalamud
      shell: pwsh
      run: |
        $dalamud = Join-Path $env:RUNNER_TEMP dalamud
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip $dalamud
        "DALAMUD_HOME=$dalamud" >> $env:GITHUB_ENV

    # Locked mode fails if any packages.lock.json is out of date, as the official plugin build would.
    - name: Restore
      run: dotnet restore AetherFrame.slnx --locked-mode

    - name: Build
      run: dotnet build AetherFrame.slnx --configuration Release --no-restore

    - name: Test
      env:
        AETHERFRAME_PLUGIN_ASSEMBLY: ${{ github.workspace }}/AetherFrame/bin/x64/Release/AetherFrame.dll
        AETHERFRAME_PLUGIN_FLAVOUR: preview
      run: dotnet test AetherFrame.Tests/AetherFrame.Tests.csproj --configuration Release --no-build

    - name: Test the release tooling
      env:
        AETHERFRAME_RELEASE_PACKAGE: ${{ github.workspace }}/AetherFrame/bin/x64/Release/AetherFrame/latest.zip
      run: dotnet test tools/AetherFrame.ReleaseTools.Tests/AetherFrame.ReleaseTools.Tests.csproj --configuration Release --no-build

    # The remote protocol foundation (docs/networking/NETWORK0.md): its own assembly, whose sources the
    # sharing build compiles into AetherFrame.dll (AetherFrame.csproj), with its own test vectors,
    # canonicalization proofs and adversarial suites.
    - name: Test the protocol
      run: dotnet test AetherFrame.Protocol.Tests/AetherFrame.Protocol.Tests.csproj --configuration Release --no-build

    - name: Check and stage the package
      shell: pwsh
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: ./.github/scripts/New-ReleasePackage.ps1 -Version $env:VERSION -Destination dist

    # The staged ZIP against every release rule (docs/CustomRepository.md): built from this commit, at
    # this version, for the configured Dalamud API level, listed correctly in SHA256SUMS.txt, and
    # matching the tag when there is one.
    - name: Check the staged package
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        COMMIT: ${{ github.sha }}
        TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      run: |
        tag_option=()
        if [ -n "$TAG" ]; then tag_option=(--tag "$TAG"); fi
        dotnet tools/AetherFrame.ReleaseTools/bin/Release/net10.0/AetherFrame.ReleaseTools.dll validate-package \
          --package "dist/AetherFrame-$VERSION.zip" \
          --config distribution/repository.json \
          --version-props Version.props \
          --csproj AetherFrame/AetherFrame.csproj \
          --changelog CHANGELOG.md \
          --checksums dist/SHA256SUMS.txt \
          --commit "$COMMIT" \
          "${tag_option[@]}" \
          --summary dist/package-summary.json

    # Art on demand (docs/networking/DecisionRegister.md, "Art on demand"): the release's plugin
    # downloads its Art Styles' artwork from the commits AetherFrame/Assets/ArtFiles.txt pins, so
    # every pin must be in master's history and hold the table's bytes, and every hosted file must
    # download from its address as exactly those bytes, before a release is drafted.
    - name: Check the hosted artwork's pins
      shell: bash
      env:
        PYTHON: python
      run: bash .github/scripts/check-art-pins.sh

    - name: Check that every hosted artwork file downloads
      shell: bash
      run: bash .github/scripts/check-hosted-art.sh

    # What the custom repository would serve for this release, in both channel shapes, kept with the
    # package as an artifact. Nothing is published: the pluginmaster.json Dalamud reads is updated
    # only by the Publish custom repository workflow, after the GitHub Release has been published by hand.
    - name: Generate the custom repository metadata (not published)
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        tool=tools/AetherFrame.ReleaseTools/bin/Release/net10.0/AetherFrame.ReleaseTools.dll
        last_update="$(git log -1 --format=%cI HEAD)"
        dotnet "$tool" generate-repository --config distribution/repository.json --changelog CHANGELOG.md \
          --last-update "$last_update" --stable-package "dist/AetherFrame-$VERSION.zip" \
          --output dist/pluginmaster.json
        dotnet "$tool" generate-repository --config distribution/repository.json --changelog CHANGELOG.md \
          --last-update "$last_update" --testing-exclusive --testing-package "dist/AetherFrame-$VERSION.zip" \
          --output dist/pluginmaster.testing-exclusive.json
        dotnet "$tool" validate-repository --repository dist/pluginmaster.json --config distribution/repository.json \
          --stable-package "dist/AetherFrame-$VERSION.zip" --changelog CHANGELOG.md
        dotnet "$tool" verify-checksums --checksums dist/SHA256SUMS.txt
        {
          echo "### AetherFrame $VERSION"
          echo
          echo '`SHA256SUMS.txt`:'
          echo
          echo '```'
          cat dist/SHA256SUMS.txt
          echo '```'
          echo
          echo 'The workflow artifact holds the package, its checksums, the release notes, `package-summary.json` and the custom repository metadata (`pluginmaster.json`, `pluginmaster.testing-exclusive.json`). Nothing was published.'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Store the package
      uses: actions/upload-artifact@v4
      with:
        name: AetherFrame-${{ steps.version.outputs.version }}
        path: dist/*
        if-no-files-found: error
        retention-days: 30

  draft-release:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    # Add required reviewers to this environment (Settings > Environments) to approve each draft.
    environment: release
    permissions:
      contents: write

    steps:
    - name: Fetch the package
      uses: actions/download-artifact@v4
      with:
        name: AetherFrame-${{ needs.package.outputs.version }}
        path: dist

    - name: Create the draft release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
        VERSION: ${{ needs.package.outputs.version }}
      run: |
        # Never replace or add to an existing release, draft or published.
        if [ -n "$(gh release list --limit 1000 --json tagName --jq ".[] | select(.tagName == \"$TAG\") | .tagName")" ]; then
          echo "::error::A release for $TAG already exists. Nothing was changed."
          exit 1
        fi
        gh release create "$TAG" \
          --draft \
          --verify-tag \
          --prerelease \
          --title "AetherFrame $VERSION" \
          --notes-file dist/release-notes.md \
          "dist/AetherFrame-$VERSION.zip" \
          dist/SHA256SUMS.txt
