name: Deploy the server

# Deploys one reviewed commit of master to the owner's server (docs/networking/Runbook.md). Nothing
# runs on its own: someone starts it with the commit, and the "production" environment waits for
# the owner's approval before any step that can reach the server. Its secrets live only in that
# environment, and Claude never handles them.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "The full SHA of the commit on master to deploy"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    # The Server health monitor skips its check while a deploy runs, so a deploy that hangs (on a
    # connection that stopped answering, say) is cancelled after 30 minutes, not GitHub's default 6
    # hours. The time spent waiting for the owner's approval doesn't count.
    timeout-minutes: 30
    steps:
      - name: Check the inputs
        env:
          COMMIT: ${{ github.event.inputs.commit }}
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "Give a full 40-character SHA."; exit 1; }
          [[ "$DEPLOY_DOMAIN" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$ ]] || { echo "DEPLOY_DOMAIN is not a hostname."; exit 1; }

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.commit }}
          fetch-depth: 0

      - name: Check the commit is on master
        env:
          COMMIT: ${{ github.event.inputs.commit }}
        run: |
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$COMMIT" origin/master || { echo "$COMMIT is not on master."; exit 1; }

      - name: Build the images
        env:
          COMMIT: ${{ github.event.inputs.commit }}
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: |
          docker build -f deploy/server.Dockerfile -t "aetherframe-server:$COMMIT" .
          docker build --secret id=sixlabors_license,env=SIXLABORS_LICENSE_KEY -f deploy/worker.Dockerfile -t "aetherframe-worker:$COMMIT" .

      - name: Sign in to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          COMMIT: ${{ github.event.inputs.commit }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
        run: |
          target="aetherframe-deploy@$DEPLOY_HOST"
          # For ssh and scp both: a connection that doesn't open within 20 seconds, or stops answering
          # for a minute, fails the step rather than hanging it.
          ssh_opts=(-i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          docker save "aetherframe-server:$COMMIT" "aetherframe-worker:$COMMIT" | gzip | ssh "${ssh_opts[@]}" "$target" 'gunzip | docker load'
          scp "${ssh_opts[@]}" deploy/compose.yaml deploy/Caddyfile deploy/aetherframe-worker.sh "$target:/opt/aetherframe/"
          # Start the new version: the worker service restarts with the new script first, so every run
          # that connects to the new server comes from the restarted service, which the worker check
          # below relies on; then Caddy is pulled and recreated so its image and Caddyfile are current,
          # and older AetherFrame images are removed.
          ssh "${ssh_opts[@]}" "$target" "set -e; cd /opt/aetherframe && chmod 755 aetherframe-worker.sh \
            && printf 'AETHERFRAME_VERSION=%s\nAETHERFRAME_DOMAIN=%s\n' '$COMMIT' '$DEPLOY_DOMAIN' > .env \
            && sudo /usr/bin/systemctl restart aetherframe-worker.service \
            && docker compose pull caddy && docker compose up -d --remove-orphans && docker compose up -d --force-recreate caddy \
            && (docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '^aetherframe-(server|worker):' | grep -v ':$COMMIT\$' | xargs -r docker rmi >/dev/null 2>&1 || true)"

      - name: Check it answers
        env:
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "https://$DEPLOY_DOMAIN/v1/status"; then exit 0; fi
            sleep 5
          done
          echo "The server didn't answer /v1/status."
          exit 1

      # An image worker run must connect after the deploy (decision "Watching the server"). The
      # server reads worker true only when a run connected within the last 2 minutes, with no grace
      # after its start, so true from the new server shows a run connected to it, and the Deploy step
      # restarts the worker service before the new server starts, so that run is the new service's. A healthy host
      # connects one within seconds, and true is waited for up to 150 seconds. A server without
      # /v1/health (a rollback to an older commit) answers 404, which only warns.
      - name: Check the image worker connects
        env:
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
        run: |
          health="$RUNNER_TEMP/health.json"
          start=$(date +%s)
          while true; do
            elapsed=$(($(date +%s) - start))
            code="$(curl --proto =https --max-time 20 --max-filesize 4096 --silent --output "$health" --write-out '%{http_code}' "https://$DEPLOY_DOMAIN/v1/health")" || code=000
            if [ "$code" = 404 ]; then
              echo "::warning::This server has no /v1/health (a commit from before it), so the image worker wasn't checked."
              exit 0
            fi
            if [ "$code" = 200 ] && jq -e '.worker == true' "$health" > /dev/null 2>&1; then
              echo "An image worker run connected."
              exit 0
            fi
            if [ "$elapsed" -ge 150 ]; then
              break
            fi
            sleep 5
          done
          echo "::error::No image worker run connected after the deploy: /v1/health doesn't say worker true. See the worker rows in docs/networking/Runbook.md, section 3, and its Health alerts."
          exit 1

      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/deploy
