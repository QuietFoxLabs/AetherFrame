name: Build and test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        # Windows is where players build; Linux is where the official Dalamud plugin build runs.
        os: [ windows-2022, ubuntu-24.04 ]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    # Dalamud.NET.Sdk takes the Dalamud reference assemblies from DALAMUD_HOME on every OS.
    - name: Download Dalamud
      shell: pwsh
      run: |
        $dalamud = Join-Path $env:RUNNER_TEMP dalamud
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip $dalamud
        "DALAMUD_HOME=$dalamud" >> $env:GITHUB_ENV

    - name: Build
      run: dotnet build AetherFrame.slnx --configuration Release

    # Names the plugin assembly so the embedded artwork is checked in the DLL that ships, not only
    # in the test assembly.
    - name: Test
      env:
        AETHERFRAME_PLUGIN_ASSEMBLY: ${{ github.workspace }}/AetherFrame/bin/x64/Release/AetherFrame.dll
        AETHERFRAME_PLUGIN_FLAVOUR: preview
      run: dotnet test AetherFrame.Tests/AetherFrame.Tests.csproj --configuration Release --no-build

    # The release tooling's own tests, including the check that the package this build produced is a
    # valid release package and regenerates the committed dry-run repository fixture.
    - name: Test the release tooling
      env:
        AETHERFRAME_RELEASE_PACKAGE: ${{ github.workspace }}/AetherFrame/bin/x64/Release/AetherFrame/latest.zip
      run: dotnet test tools/AetherFrame.ReleaseTools.Tests/AetherFrame.ReleaseTools.Tests.csproj --configuration Release --no-build

    # The remote protocol foundation (docs/networking/NETWORK0.md): a standalone assembly the plugin
    # does not reference yet, with its own test vectors, canonicalization proofs and adversarial suites.
    - name: Test the protocol
      run: dotnet test AetherFrame.Protocol.Tests/AetherFrame.Protocol.Tests.csproj --configuration Release --no-build

    # The local persona management foundation (docs/networking/NETWORK1_PersonaFoundation.md): a
    # standalone assembly the plugin does not reference yet, holding the in-memory persona model and
    # the seams for protected key storage and encrypted backups, with synthetic keys only.
    - name: Test the persona foundation
      run: dotnet test AetherFrame.Personas.Tests/AetherFrame.Personas.Tests.csproj --configuration Release --no-build

    # The server (docs/networking/NETWORK2.md, N2-7), on ASP.NET Core's test host with a temporary
    # database, a manual clock and a fake Lodestone: nothing connects to anything.
    - name: Test the server
      run: dotnet test server/AetherFrame.Server.Tests/AetherFrame.Server.Tests.csproj --configuration Release --no-build

    # Every rule a release must pass, applied to every build (docs/CustomRepository.md): the DLL is
    # x64, built from this commit, at the Version.props version and the configured Dalamud API level,
    # and the package holds exactly the three plugin files.
    - name: Check the plugin package
      shell: bash
      env:
        COMMIT: ${{ github.sha }}
      run: >
        dotnet tools/AetherFrame.ReleaseTools/bin/Release/net10.0/AetherFrame.ReleaseTools.dll validate-package
        --package AetherFrame/bin/x64/Release/AetherFrame/latest.zip
        --config distribution/repository.json
        --version-props Version.props
        --csproj AetherFrame/AetherFrame.csproj
        --changelog CHANGELOG.md
        --commit "$COMMIT"

    # The custom repository publication script runs on Linux, in a workflow that only ever runs by hand
    # (publish-custom-repository.yml), so it is checked here on every change instead. The release
    # tooling tests above cover the decisions it hands to AetherFrame.ReleaseTools.
    - name: Check the publication script
      if: runner.os == 'Linux'
      run: shellcheck .github/scripts/custom-repository.sh

    - name: Store artifacts
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: AetherFrame
        path: .\AetherFrame\bin\x64\Release\AetherFrame\*
        if-no-files-found: error
        retention-days: 1

    # The player flavour (docs/networking/DecisionRegister.md, D9b, P2 and "Opening the alpha"): the
    # build with no networking code at all, which the sharing build replaced as the default on
    # October 1, 2026, built once, on Windows, into a separate output, and held to its boundary
    # (no HTTP, no protocol or persona code). DalamudPackager still rewrites the package under bin/
    # with the DLL it finds there, so this runs last, after the package check and the stored
    # artifact. The test filter is load-bearing: the rest of the suite expects AetherFrame.json
    # beside the DLL, which DalamudPackager writes under bin/, not here.
    - name: Build and check the player flavour
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        AETHERFRAME_PLUGIN_FLAVOUR: player
      run: |
        $out = Join-Path $env:RUNNER_TEMP player
        dotnet build AetherFrame/AetherFrame.csproj --configuration Release -p:Platform=x64 -p:AetherFrameNetworkPreview=false -p:TreatWarningsAsErrors=true -p:OutDir="$out/"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $env:AETHERFRAME_PLUGIN_ASSEMBLY = Join-Path $out AetherFrame.dll
        dotnet test AetherFrame.Tests/AetherFrame.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~PluginAssemblyBoundaryTests"

  # The deployment kit (docs/networking/NETWORK2.md, N2-8): both images build, and the three
  # services start and answer on plain HTTP, with the worker as isolated as the compose file says.
  deployment-kit:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Build the images
      run: |
        docker build -f deploy/server.Dockerfile -t aetherframe-server:ci .
        docker build -f deploy/worker.Dockerfile -t aetherframe-worker:ci .

    - name: Start the deployment
      working-directory: deploy
      run: |
        mkdir -p config
        printf '{"AetherFrame":{"AllowedLodestoneIds":["12345678"]}}\n' > config/aetherframe.json
        printf 'AETHERFRAME_VERSION=ci\nAETHERFRAME_DOMAIN=plates.example.com\n' > .env
        docker compose -f compose.yaml -f compose.ci.yaml up -d
        # As root, as systemd runs it on the server: it reads the socket volume's folder.
        sudo env AETHERFRAME_ENV_FILE=.env AETHERFRAME_WORKER_LOG_DRIVER=json-file AETHERFRAME_WORKER_LIFE=8 nohup bash aetherframe-worker.sh > worker-loop.log 2>&1 &
        echo $! > worker-loop.pid

    - name: Check it answers, and the worker is isolated
      working-directory: deploy
      run: |
        for attempt in $(seq 1 30); do
          curl -fsS http://localhost:8088/v1/status > status.json && break
          sleep 2
        done
        grep -q '"protocolVersion":32769' status.json
        code=$(curl -sS -X POST -o challenge.bin -w '%{http_code}' http://localhost:8088/v1/challenge)
        test "$code" = 200
        test "$(stat -c %s challenge.bin)" = 32
        for attempt in $(seq 1 30); do
          worker=$(docker ps -q --filter name=aetherframe-worker | head -n 1)
          [ -n "$worker" ] && break
          sleep 2
        done
        test -n "$worker"
        test "$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$worker")" = none
        test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$worker")" = true
        test "$(docker inspect -f '{{.Config.User}}' "$worker")" = imageworker
        test "$(docker exec "$worker" ls /sys/class/net)" = lo
        # I2's per-job isolation: the run's one mount is the single socket the server offered it.
        test "$(docker inspect -f '{{len .Mounts}}' "$worker")" = 1
        docker inspect -f '{{range .Mounts}}{{.Source}} {{.Destination}} {{.RW}}{{end}}' "$worker" | grep -Eq '/runs/run-[0-9a-f]{32}\.sock /run/aetherframe/images.sock false$'
        # A run is ended from outside after its life (8 s here, before the worker's own 15-second idle
        # timeout): still up a few seconds in, gone by its life, and a fresh run in its place.
        sleep 2
        test -n "$(docker ps -q --filter id="$worker")"
        sleep 9
        test -z "$(docker ps -q --filter id="$worker")"
        test -n "$(docker ps -q --filter name=aetherframe-worker)"
        docker compose -f compose.yaml -f compose.ci.yaml exec -T server dotnet AetherFrame.Server.dll admin characters | grep -q '0 rows.'
        docker compose -f compose.yaml -f compose.ci.yaml exec -T server dotnet AetherFrame.Server.dll admin allowlist | grep -q '^12345678$'

    - name: Show the logs
      if: failure()
      working-directory: deploy
      run: |
        docker compose -f compose.yaml -f compose.ci.yaml logs --no-color
        cat worker-loop.log

    - name: Stop it
      if: always()
      working-directory: deploy
      run: |
        sudo kill "$(cat worker-loop.pid)" 2>/dev/null || true
        docker ps -q --filter name=aetherframe-worker | xargs -r docker rm -f
        docker compose -f compose.yaml -f compose.ci.yaml down -v
